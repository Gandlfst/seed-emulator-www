<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEED Emulator · 黑色与灰色背景对比</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 30px; background: #e9f0ef; color: #233e41; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { max-width: 1160px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 25px; font-weight: 650; }
    .intro { margin: 0 0 22px; color: #526f73; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 22px; }
    article { overflow: hidden; border: 1px solid #cfddda; border-radius: 12px; background: #f2f9f8; }
    h2 { margin: 0; padding: 15px 22px; border-bottom: 1px solid #d4e5e4; background: white; font-size: 19px; }
    .large { height: 203px; display: grid; place-items: center; border-bottom: 1px solid #d4e5e4; }
    .logo { position: relative; flex: 0 0 auto; width: 440px; height: 101px; overflow: hidden; }
    .logo img { position: absolute; display: block; max-width: none; width: 607px; height: auto; left: -17px; top: -50px; }
    .gray .base { clip-path: polygon(0 0,100% 0,100% 54%,38.5% 54%,38.5% 100%,0 100%); }
    .gray .word { clip-path: inset(54% 21% 25% 38.5%); }
    .caption { font-size: 12px; color: #526f73; padding: 17px 22px 0; }
    .site-header { padding: 0 22px 18px; }
    .mini { width: 300px; height: 72px; margin: 17px 0 22px; }
    .mini img { width: 414px; left: -12px; top: -34px; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 0; background: #2c7173; color: white; padding: 5px; border-radius: 7px; font-size: 10px; font-weight: 600; }
    nav span { padding: 9px 8px; white-space: nowrap; }
    nav .active { background: #ffffff1c; border-radius: 4px; }
    footer { color: #526f73; font-size: 13px; margin-top: 18px; }
    @media(max-width:900px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Logo 黑色 / 灰色 · 背景效果</h1>
    <p class="intro">同款网站浅色背景 #F2F9F8 · 同一套 SEED 与完整网络球</p>
    <div class="grid">
      <article>
        <h2>黑色</h2>
        <div class="large"><div class="logo"><img src="../seed-emulator-black-v2.png" alt="黑色 EMULATOR Logo"></div></div>
        <div class="caption">页头尺寸预览</div>
        <div class="site-header">
          <div class="logo mini"><img src="../seed-emulator-black-v2.png" alt="页头黑色 Logo"></div>
          <nav aria-label="黑色方案菜单示意"><span class="active">Home</span><span>Internet Emulator</span><span>Satellite</span><span>Blockchain</span><span>About us</span></nav>
        </div>
      </article>
      <article>
        <h2>灰色</h2>
        <div class="large"><div class="logo gray"><img class="base" src="../seed-emulator-black-v2.png" alt=""><img class="word" src="graphite-wordmark-study.png" alt="灰色 EMULATOR Logo"></div></div>
        <div class="caption">页头尺寸预览</div>
        <div class="site-header">
          <div class="logo mini gray"><img class="base" src="../seed-emulator-black-v2.png" alt=""><img class="word" src="graphite-wordmark-study.png" alt="页头灰色 Logo"></div>
          <nav aria-label="灰色方案菜单示意"><span class="active">Home</span><span>Internet Emulator</span><span>Satellite</span><span>Blockchain</span><span>About us</span></nav>
        </div>
      </article>
    </div>
    <footer>仅效果预览 · 网站 Logo 尚未替换</footer>
  </main>
</body>
</html>
