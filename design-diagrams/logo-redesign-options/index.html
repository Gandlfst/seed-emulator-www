<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEED Emulator · Logo 设计方向</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 34px; color: #203d42; background: #e9f0ef; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { max-width: 1120px; margin: 0 auto; }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: 26px; font-weight: 650; }
    header p, footer { color: #60767a; font-size: 14px; margin: 0; }
    .option { display: grid; grid-template-columns: 210px minmax(0, 1fr); margin: 0 0 16px; overflow: hidden; border: 1px solid #cfddda; border-radius: 12px; background: #fff; }
    .label { padding: 26px 24px; align-self: center; }
    h2 { margin: 0 0 9px; font-size: 21px; }
    .label p { margin: 7px 0 0; color: #60767a; font-size: 14px; line-height: 1.7; }
    .recommended { display: inline-block; margin-bottom: 10px; padding: 3px 9px; border-radius: 5px; color: #2c7173; background: #e7f3ef; font-size: 12px; }
    .stage { display: flex; height: 166px; align-items: center; background: #f2f9f8; border-bottom: 7px solid #2c7173; }
    .stage img { display: block; width: 100%; height: 100%; object-fit: contain; }
    footer { padding: 3px 0 0; }
    @media (max-width: 640px) {
      body { padding: 20px 14px; }
      .option { grid-template-columns: 1fr; }
      .label { padding: 15px 20px; }
      .stage { height: 145px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>SEED Emulator · Logo 设计方向</h1>
      <p>延续原 SEED 品牌字形，重新设计右侧文字与符号</p>
    </header>
    <section class="option">
      <div class="label"><span class="recommended">推荐</span><h2>01 · 互联节点</h2><p>突出网络与互联<br>兼顾三个项目</p></div>
      <div class="stage"><img src="seed-emulator-mesh-v1.png" alt="方案一，五个互联节点与黑色 EMULATOR"></div>
    </section>
    <section class="option">
      <div class="label"><h2>02 · 轨道网络</h2><p>突出连接与探索<br>轻盈、科技感</p></div>
      <div class="stage"><img src="seed-emulator-orbit-v1.png" alt="方案二，轨道网络与黑色 EMULATOR"></div>
    </section>
    <section class="option">
      <div class="label"><h2>03 · 模块互联</h2><p>呼应原三齿轮结构<br>突出可组合仿真</p></div>
      <div class="stage"><img src="seed-emulator-modular-v1.png" alt="方案三，互联模块与黑色 EMULATOR"></div>
    </section>
    <footer>AI 概念草图 · 正式稿复用原始 SEED 图形，确保不变 · 网站尚未替换</footer>
  </main>
</body>
</html>
