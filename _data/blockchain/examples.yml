- title: Ethereum Faucet
  description: Fund Ethereum accounts with test Ether through a faucet service in
    an emulated blockchain network.
  code: D20
  category_id: blockchain
  source_path: examples/blockchain/D20_faucet
  slug: d20-faucet
  url: "/examples/d20-faucet/"
  overview: |-
    ## Overview

    This example deploys a faucet service in an Ethereum PoA or PoS blockchain, allowing users to request test Ether for their accounts. Users can configure funding requests during emulator construction or request funds after the blockchain starts through HTTP APIs and client programs. The faucet transfers Ether by submitting real transactions through an Ethereum node, allowing users to observe the funding process through transaction records and account balances. You can further extend the scenario by integrating the faucet with wallets, smart contracts, or custom applications that require funded accounts. This example provides a convenient way to manage test funds and support blockchain application development and testing.
- title: Smart Contract Deployment
  description: Deploy Ethereum smart contracts and make their addresses available
    to applications running in the emulated network.
  code: D21
  category_id: blockchain
  source_path: examples/blockchain/D21_deploy_contract
  slug: d21-deploy-contract
  url: "/examples/d21-deploy-contract/"
  overview: |-
    ## Overview

    This example demonstrates how to deploy smart contracts on an Ethereum PoA or PoS blockchain using a utility server. Users can provide compiled smart contracts, automatically deploy them after the blockchain starts, and retrieve their addresses through the utility server's APIs. By inspecting deployment transactions, contract addresses, and blockchain records, users can understand how smart contracts are deployed and accessed by different applications. You can further extend the scenario by deploying additional contracts, integrating them with other services, or using development tools such as Remix and Hardhat to test contract interactions. This example provides a foundation for developing and experimenting with decentralized applications in a controllable blockchain environment.
- title: Blockchain Oracle
  description: Connect off-chain applications with Ethereum smart contracts through
    an oracle service.
  code: D22
  category_id: blockchain
  source_path: examples/blockchain/D22_oracle
  slug: d22-oracle
  url: "/examples/d22-oracle/"
  overview: |-
    ## Overview

    This example demonstrates how an Ethereum smart contract can obtain information from an off-chain oracle service. It deploys an oracle node and a user application alongside an emulated Ethereum blockchain. When the user requests a price update, the smart contract emits an event that is detected by the oracle node. The oracle generates a sample price and submits a transaction to update the value stored in the contract, which the user can then retrieve. By following these interactions, users can understand how smart contracts communicate with external services through blockchain events and transactions. You can further extend the scenario by connecting the oracle to real data sources, modifying update mechanisms, or changing network conditions to investigate how external dependencies affect blockchain applications.
- title: Dynamic Validator Participation
  description: Add new validators to a running Ethereum PoS blockchain and observe
    their activation and participation in consensus.
  overview: |-
    ## Overview

    This example demonstrates how to introduce new validators into an Ethereum PoS blockchain after the network has already started. Unlike validators initialized at genesis, new validators must create their credentials, submit a deposit transaction, and complete the activation process before participating in consensus. Users can observe validator status changes through beacon node APIs and client logs, following the process from registration to activation and attestation. You can further extend the scenario by adding more validators, adjusting their network placement, or changing network conditions to investigate how validator participation affects consensus operation. This example provides a practical environment for studying validator management and dynamic participation in Ethereum PoS.
  code: D23
  category_id: blockchain
  source_path: examples/blockchain/D23_validator
  slug: d23-validator
  url: "/examples/d23-validator/"
