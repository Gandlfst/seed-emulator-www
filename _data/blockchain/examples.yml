    to: "/examples/d01-ethereum-pos/readme/"
- title: Monero Blockchain
  description: Build a private Monero blockchain with configurable peer connections,
    mining activity, and client software.
  overview: |-
    ## Overview

    This example deploys a Monero blockchain across an emulated Internet using real Monero client software. Users can configure different types of nodes, including seed nodes, full nodes, pruned nodes, and light wallets, as well as customize mining behavior and peer connections. The example supports both simplified deployment and detailed configuration, allowing users to construct Monero networks for different experimental needs. By inspecting peer connections, block production, and wallet transactions, users can explore how Monero nodes communicate and maintain the blockchain. You can further extend the scenario by changing mining difficulty, adjusting node connectivity, or deploying modified Monero clients to study blockchain performance, peer-to-peer networking, and security vulnerabilities.
  code: D60
  category_id: blockchain
  source_path: examples/blockchain/D60_monero
  slug: d60-monero
  url: "/examples/d60-monero/"
- title: Solana Blockchain
  description: Deploy a private Solana blockchain using real Agave validators across
    a configurable Internet.
  overview: |-
    ## Overview

    This example creates a private Solana blockchain using real Agave validator software deployed across multiple autonomous systems. It establishes a bootstrap validator and additional validators that communicate through the emulated Internet to maintain the blockchain. Users can inspect validator participation, peer discovery, slot progression, and transaction processing through standard Solana tools. The example also supports transferring SOL between accounts and deploying Solana programs, allowing users to experiment with blockchain applications. You can further extend the scenario by adding validators, changing their placement, or modifying network connections and transaction workloads to investigate how network conditions affect validator communication, transaction processing, and consensus performance.
  code: D70
  category_id: blockchain
  source_path: examples/blockchain/D70_solana
  slug: d70-solana
  url: "/examples/d70-solana/"
