# Example content and source paths. URL stubs: pages/examples/_examples/.
- title: Ethereum Proof of Authority (PoA)
  description: Build a private Ethereum Proof of Authority (PoA) blockchain with real
    Geth clients on a configurable Internet.
  code: D00
  category_id: blockchain
  source_path: examples/blockchain/D00_ethereum_poa
  slug: d00-ethereum-poa
  url: "/examples/d00-ethereum-poa/"
  overview: |-
    ## Overview

    This example creates a private Ethereum PoA blockchain and deploys its nodes across an emulated Internet. Users can configure blockchain nodes, create pre-funded accounts, and customize client settings. By running real Ethereum software, the example allows users to explore how blockchain nodes communicate, process transactions, and maintain a shared ledger. You can further extend the scenario by adding nodes, changing their placement across different networks, or using customized Geth clients to investigate how network conditions and client configurations affect blockchain behavior. It also provides a reusable foundation for more advanced experiments involving account funding, smart contracts, and blockchain applications.
- title: Ethereum Proof of Stake (PoS)
  description: Build a private Ethereum Proof of Stake (PoS) blockchain with real
    execution, consensus, and validator clients across an emulated Internet.
  code: D01
  category_id: blockchain
  source_path: examples/blockchain/D01_ethereum_pos
  slug: d01-ethereum-pos
  url: "/examples/d01-ethereum-pos/"
  overview: |-
    ## Overview

    This example builds an Ethereum PoS blockchain using Geth execution clients and Lighthouse consensus and validator clients, deployed across multiple autonomous systems. It configures the initial blockchain state, validator population, and peer connections to establish a functioning PoS network. Users can observe how the different clients work together to process transactions, propose blocks, submit attestations, and maintain blockchain consensus. You can further extend the scenario by adding nodes, adjusting validator configurations, or changing network topologies and peer connections to investigate how network conditions affect block propagation, chain synchronization, and consensus performance. This example provides a foundation for studying Ethereum PoS and conducting more advanced blockchain experiments.
- title: Ethereum Blockchain Explorer
  description: Visualize Ethereum PoS blockchain activity, including blocks, transactions,
    validators, and consensus progress.
  overview: |-
    ## Overview

    This example deploys an Ethereum PoS blockchain with Eth Explorer, a web-based tool for monitoring blockchain activity. Users can explore blocks, transactions, slots, epochs, and validator information through an interactive interface. Together with Internet Map, which visualizes the underlying network topology, users can observe blockchain operations alongside the network infrastructure hosting the blockchain nodes. You can further extend the scenario by adding nodes, adjusting validator configurations, or modifying network conditions to investigate how these changes affect block production, transaction processing, and consensus progress. This example provides a convenient way to monitor blockchain behavior and analyze experimental results.
  code: D10
  category_id: blockchain
  source_path: examples/blockchain/D10_eth_explorer
  slug: d10-eth-explorer
  url: "/examples/d10-eth-explorer/"
  readme_links:
