category: 卫星网络
description: 面向网络方案设计、协议验证与应用研究的开源卫星互联网仿真平台。在动态的星地网络上运行真实协议和应用。
sections:
  architecture:
    title: 分开计算网络计划与执行网络变化
    lead: SkySEED 基于 SEED 构建卫星、地面站及地面网络。通过 Python 配置场景，按任务替换描述卫星位置、链路条件和路由策略的模型。
    points:
      - { title: 规划, text: 提前计算并保存网络变化计划。复用计划，在一致的条件下比较不同实验。 }
      - { title: 执行, text: 运行器按计划更新容器网络中的连接、链路参数和转发规则，协议与应用在其中交换真实报文。 }
    figure:
      alt: SkySEED 环境构建、分层规划与网络执行架构
      caption: 环境构建器、规划组件和运行器共同驱动容器网络。
  experiments:
    title: 观察运动中的卫星网络
    lead: 结合星座几何、网络连接、路由和运行记录，分析网络变化如何影响正在运行的应用。
    points:
      - { title: 协议与应用验证, text: 对比不同连接与路由策略，观察卫星切换对业务连续性的影响。 }
      - { title: 故障与恢复, text: 设置受控的区域干扰或链路中断，观察网络变化与业务恢复。 }
      - { title: 星座规模实验, text: 团队已完成数千颗卫星规模的仿真实验。场景可按星座、组网策略和研究需求调整。 }
    figure:
      alt: 环绕地球的卫星星座及网络连接的两个视角
      caption: SkySEED 的轨道星座与网络连接可视化。
