category: 面向 AI 智能体的虚拟世界
description: 基于 SEED 的开源虚拟世界仿真平台。AI 智能体在可配置的环境中使用真实互联网服务，研究人员可观察并重复社会、经济与安全实验。
sections:
  world:
    title: 运行真实互联网服务的虚拟社会
    lead: DNS、邮件、即时通信、文件共享、银行、支付和在线市场以容器化软件运行在 SEED 网络上。各项服务有独立的账户、数据和业务规则。
    points:
      - { title: 可观察的交互, text: 智能体可以交流、购物和转账，研究人员可以分析由此产生的消息、交易和系统状态变化。 }
      - { title: 数字世界与物理世界, text: 物理仿真描述空间、位置和移动，通过状态与事件和数字环境联动。 }
    figure:
      alt: 多个智能体在 SEED 网络中使用银行、支付、消息和社交服务
      caption: 智能体可以操作有独立账户和交易状态的实际服务。
  agents:
    title: 共享环境中的独立智能体
    lead: Agent Service 部署和管理在独立容器中运行的智能体。每个智能体可拥有自己的身份、背景、目标、记忆和行为特征。
    points:
      - { title: 推理与行动, text: 大语言模型负责推理和决策，智能体通过浏览器、API、命令和环境接口与虚拟世界交互。 }
      - { title: 观测过程, text: 监控工具记录智能体意图、工具调用、交互结果与运行状态，供研究人员分析。 }
    figure:
      alt: Agent Service、智能体容器、语言模型、工具层及数字与物理世界的交互架构
      caption: 智能体设定与共享运行环境相互独立。
  research:
    title: 在虚拟社会中开展对照实验
    lead: 独立调整智能体角色和世界条件，在社会行为、经济活动和组织场景中比较结果。
    points:
      - { title: 社会与经济行为, text: 观察信息传播、合作与信任，分析交易决策、市场行为和风险传导。 }
      - { title: 智能体能力评测, text: 评估跨服务任务、长期协作、可靠性与行为一致性。 }
      - { title: 企业仿真与安全防御, text: 在隔离环境中模拟企业组织和业务流程，研究权限边界并评估防御性蜜罐的效果。 }
    figure:
      alt: EmuVista 在社会行为、经济仿真、智能体评测和网络安全方面的应用
      caption: EmuVista 可支持的研究方向示例。
