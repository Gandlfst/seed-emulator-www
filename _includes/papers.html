{% comment %}Shared paper list. Edit publication metadata and links in _data/papers.yml.{% endcomment %}
<div class="container">
  <nav class="portal-breadcrumb" aria-label="Breadcrumb">
    <a href="{{ '/' | relative_url }}">SEED Emulators</a>
    <span aria-hidden="true">/</span>
    <span aria-current="page">{{ page.title }}</span>
  </nav>
  <section class="emulator-intro" aria-labelledby="papers-title">
    <h1 id="papers-title">{{ page.title }}</h1>
    <p class="emulator-description">{{ page.description }}</p>
  </section>
  <section class="emulator-section" aria-label="Publications">
    <ul class="emulator-resource-list">
      {% for paper in site.data.papers %}
        {% include resource.html resource=paper %}
      {% endfor %}
    </ul>
  </section>
</div>
