{% assign sidebar = include.sidebar %}

<aside class="page-sidebar" aria-label="栏目导航">
  <h2>{{ sidebar.title | default: "栏目" }}</h2>
  <nav>
    {% if sidebar.items %}
      {% for item in sidebar.items %}
        {% assign item_active = false %}
        {% if page.url == item.url %}
          {% assign item_active = true %}
        {% endif %}
        <a class="{% if item_active %}is-active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endfor %}
    {% else %}
      <a class="is-active" href="{{ page.url | relative_url }}">概览</a>
    {% endif %}
  </nav>
</aside>
