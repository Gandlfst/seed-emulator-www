{% comment %}Restore the saved theme before loading CSS to prevent a flash of the default palette.{% endcomment %}
<script id="portal-theme-config" type="application/json" data-default-theme="{{ active_theme.id }}">[{% for theme in site.data.shared.themes %}{"id":{{ theme.id | jsonify }},"background":{{ theme.colors.bg | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
<script>
  (() => {
    const themes = JSON.parse(document.getElementById('portal-theme-config').textContent);
    let saved;
    try { saved = localStorage.getItem('seed-portal-theme'); } catch (_) {}
    const theme = themes.find(item => item.id === saved) || themes.find(item => item.id === document.documentElement.dataset.portalTheme) || themes[0];
    document.documentElement.dataset.portalTheme = theme.id;
    document.querySelector('meta[name="theme-color"]').content = theme.background;
  })();
</script>
