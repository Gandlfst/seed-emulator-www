# Site metadata: titles, descriptions, social cards, and canonical URLs.
title: SEED Emulators
description: >-
  Explore Internet, satellite network, and blockchain emulators for hands-on
  research and education.
url: "https://www.seedemulator.org"
baseurl: ""
lang: en

# Site palette: default, night, teal, or dawn. Keep visitor controls hidden.
portal_theme: teal
show_theme_picker: false

# Build settings: native Jekyll and Liquid, without a frontend bundler.
markdown: kramdown
highlighter: rouge
strict_front_matter: true

# Example content lives in each project data folder; collections preserve public URLs.
collections_dir: pages/examples
collections:
  examples:
    output: true
    permalink: /examples/:name/
  # Imported upstream documents share one reader and remain separate from authored lessons.
  example_readmes:
    output: true
    permalink: /examples/:name/readme/

# Shared settings for imported READMEs; each file only needs layout: default.
defaults:
  - scope:
      path: ""
      type: example_readmes
    values:
      example_readme: true
      examples: true
      nav_key: internet
      render_with_liquid: false

# Development files excluded from publishing; Jekyll handles its internal directories.
exclude:
  - .bundle
  - .github
  - .gitignore
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - vendor
  - _data/internet/video/README.md

# Publish only these static assets from the data folders, not the YAML files.
include:
  - _data/blockchain/images/POS-1.png
  - _data/blockchain/images/blockchain-ledger-gold-small.webp
  - _data/blockchain/images/blockchain-ledger-gold.png
  - _data/shared/images/seed-emulator-logo.png
  - _data/shared/images/seed-mark.svg
  - _data/internet/images/build-poster.svg
  - _data/internet/images/demo-poster.jpg
  - _data/internet/images/internet-topology-green-small.webp
  - _data/internet/images/internet-topology-green.png
  - _data/internet/video/3000-2.mp4
  - _data/internet/video/3000-2.webm
  - _data/internet/video/build-and-run.mp4
  - _data/internet/video/build-and-run.webm
  - _data/satellite/images/satellite-network-blue-small.webp
  - _data/satellite/images/satellite-network-blue.png
