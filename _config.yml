# Site metadata: titles, descriptions, social cards, and canonical URLs.
title: SEED Emulators
description: >-
  Explore Internet, satellite network, and blockchain emulators for hands-on
  research and education.
url: "https://www.seedemulator.org"
baseurl: ""
lang: en

# Build settings: native Jekyll and Liquid, without a frontend bundler.
markdown: kramdown
highlighter: rouge
strict_front_matter: true

# Each example is an editable Markdown lesson rendered by the shared layout.
collections:
  examples:
    output: true
    permalink: /examples/:name/
  # Imported upstream documents share one reader and remain separate from authored lessons.
  example_readmes:
    output: true
    permalink: /examples/:name/readme/

# Shared settings for imported READMEs; each file only needs layout: default.
defaults:
  - scope:
      path: ""
      type: example_readmes
    values:
      example_readme: true
      examples: true
      nav_key: internet
      render_with_liquid: false

# Development files excluded from publishing; Jekyll handles its internal directories.
exclude:
  - .bundle
  - .cache
  - .github
  - .gitignore
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - package.json
  - package-lock.json
  - scripts
  - vendor
  - video/README.md
